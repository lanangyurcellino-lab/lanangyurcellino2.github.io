<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Aksara · Perpustakaan Kita</title>
<link href="https://fonts.googleapis.com/css2?family=Lora:wght@400;500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#f4f4f0;--card:#fffefb;--g:#2f5d46;--gd:#243d31;--tx:#222;--mut:#6b6f6a;--line:#e3e3dc;--sand:#ede4d4;--gl:#e3ebdd;--warn:#f6e6cf;--wt:#8a5a1c;--red:#f6dcd8;--rt:#a03a2c;--side:#efefe9;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#171a18;--card:#1f2421;--tx:#ecece6;--mut:#9aa09a;--line:#323935;--sand:#2b2f2a;--gl:#2a3a30;--warn:#3d3224;--wt:#e0b377;--red:#43262367;--rt:#f0a094;--side:#1b1f1c;--g:#4f8f6c}}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:14px Inter,system-ui,sans-serif}
h1,h2,h3,.serif{font-family:Lora,Georgia,serif;font-weight:400;margin:0}
h1{font-size:34px}h2{font-size:22px}a{color:inherit;text-decoration:none;cursor:pointer}
.app{display:flex;min-height:100vh}.ic,.sl{display:none}.nav .ic{font-style:normal}.side{position:sticky;top:0;align-self:flex-start;height:100vh;overflow-y:auto;z-index:20;width:224px;background:var(--side);padding:20px;display:flex;flex-direction:column;gap:6px;flex:none}
.logo{display:flex;align-items:center;gap:10px;margin-bottom:22px}.logo i{width:36px;height:36px;border-radius:9px;background:var(--g);color:#fff;display:grid;place-items:center;font-style:normal}.logo b{font:500 26px Lora,serif}.logo small{display:block;font-size:8px;color:var(--mut);letter-spacing:.5px}
.nl{font-size:11px;color:var(--mut);margin:4px 0}.nav{padding:12px;border-radius:8px;font-weight:500;display:block}.nav.on{background:var(--g);color:#fff}
.quote{border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:20px}.quote .serif{color:var(--g);font-size:19px;line-height:1.25}.quote small{color:var(--mut);display:block;margin-top:10px}
.user{margin-top:auto;background:var(--card);border-radius:10px;padding:10px;display:flex;gap:10px;align-items:center}.av{width:34px;height:34px;border-radius:50%;background:var(--sand);display:grid;place-items:center;font-size:12px}
.main{flex:1;min-width:0}.top{display:flex;justify-content:space-between;align-items:center;padding:24px 32px;background:var(--card);border-bottom:1px solid var(--line);color:var(--mut)}
.pill{background:var(--gl);color:var(--g);border-radius:99px;padding:4px 10px;font-size:12px;display:inline-block}.pill.w{background:var(--warn);color:var(--wt)}.pill.r{background:var(--red);color:var(--rt)}.pill.n{background:var(--line);color:var(--mut)}
.pg{padding:32px;max-width:1200px}.eb{font-size:11px;letter-spacing:.5px;color:var(--g);text-transform:uppercase;font-weight:600}.sub{color:var(--mut);margin:8px 0 24px}
.hd{display:flex;justify-content:space-between;align-items:flex-start;gap:12px}
.btn{background:var(--g);color:#fff;border:0;border-radius:8px;padding:11px 16px;font:600 13px Inter;cursor:pointer}.btn.o{background:var(--card);color:var(--g);border:1px solid var(--line)}.btn.d{background:#a03a2c}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:22px}
.grid{display:grid;gap:16px}.g3{grid-template-columns:repeat(3,1fr)}.g4{grid-template-columns:repeat(4,1fr)}.g2{grid-template-columns:2fr 1fr}.g21{grid-template-columns:1fr 1fr}
.stat small{color:var(--mut)}.stat .serif{font-size:32px;margin:8px 0}
table{width:100%;border-collapse:collapse}th{background:var(--side);text-align:left;font-size:11px;color:var(--mut);letter-spacing:.4px;padding:12px;text-transform:uppercase}td{padding:14px 12px;border-top:1px solid var(--line);color:var(--mut)}td:first-child{color:var(--tx)}.tw{border:1px solid var(--line);border-radius:10px;overflow:auto;background:var(--card)}
input,select,textarea{width:100%;padding:12px;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--tx);font:14px Inter}label{display:block;font-weight:500;margin:14px 0 6px;font-size:13px}

function go(f){const h=location.hash.slice(1)||'login',[r,p]=h.split('/'),fn=V[r]||V.login;const x=document.activeElement,pos=x&&x.selectionStart;$('#root').innerHTML=fn(+p);if(f){const e=$('#'+f);if(e){e.focus();e.setSelectionRange(pos,pos)}}const on=$('.nav.on'),sd=$('.side');if(on&&sd&&innerWidth<=820)sd.scrollLeft=on.offsetLeft-sd.clientWidth/2+on.offsetWidth/2}
